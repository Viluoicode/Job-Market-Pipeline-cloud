name: terraform

# Lint, validate and security-scan (Checkov) the IaC on every push/PR. None of it needs AWS
# credentials, so CI stays green for free. `plan` (which needs credentials) is an optional manual run — wire up OIDC and
# uncomment the job below if you want it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  checkov:
    name: checkov (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Every finding is fixed or suppressed inline with `#checkov:skip=<id>:<reason>`; the reasons
      # are listed in docs/security-review.md. A new unreviewed finding fails the build.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false

