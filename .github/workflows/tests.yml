name: tests

# Unit-test the PySpark transforms on a real (local) SparkSession. Runs on Python 3.11 + Java 17,
# the versions PySpark 3.5 supports — hence CI rather than the author's newer local toolchain.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff, config in pyproject.toml)
        run: ruff check .

      - name: Run unit tests
        run: pytest -q
