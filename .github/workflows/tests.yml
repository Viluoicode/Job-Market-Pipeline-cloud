name: tests

# Unit-test the PySpark transforms on a real (local) SparkSession. Runs on Python 3.11 + Java 17,
# the versions PySpark 3.5 supports — hence CI rather than the author's newer local toolchain.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      # Real Apache Iceberg for tests/test_iceberg_write.py (in-memory catalog, no AWS).
      - name: Fetch Iceberg Spark runtime (checksum-verified)
        env:
          JAR_URL: https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.5.2/iceberg-spark-runtime-3.5_2.12-1.5.2.jar
          JAR_SHA1: ba9ae8affd5fb7e5e13f697599dc6750fab33a24
        run: |
          curl -fsSL -o "$RUNNER_TEMP/iceberg.jar" "$JAR_URL"
          echo "$JAR_SHA1  $RUNNER_TEMP/iceberg.jar" | sha1sum -c -
          echo "ICEBERG_SPARK_JAR=$RUNNER_TEMP/iceberg.jar" >> "$GITHUB_ENV"

      - name: Lint (ruff, config in pyproject.toml)
        run: ruff check .

      - name: Run unit tests
        run: pytest -q
