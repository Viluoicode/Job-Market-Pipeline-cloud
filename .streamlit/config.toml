# Dashboard theme. Neutral graphite surfaces carry no color of their own; one green accent marks
# the figure that matters (remote postings in the main chart, the primary action, selections).
[theme]
base = "light"
primaryColor = "#1E6B43"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#171717"
linkColor = "#1E6B43"
linkUnderline = false
borderColor = "#E5E5E5"
dataframeBorderColor = "#E5E5E5"
dataframeHeaderBackgroundColor = "#F4F4F5"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFontWeights = [500, 500, 500, 500, 500, 500]
headingFontSizes = ["2rem", "1.25rem", "1rem", "1rem", "1rem", "1rem"]
baseFontSize = 15
metricValueFontSize = "1.75rem"
metricValueFontWeight = 500
chartCategoricalColors = ["#1E6B43", "#A3A3A3", "#D4D4D4"]

[client]
# Viewers see the dashboard, not the developer menu (Deploy, rerun settings).
toolbarMode = "viewer"
